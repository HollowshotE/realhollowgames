<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indie Cross Disclaimer</title>
    <style>

            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;

            border-radius: 8px;
            text-align: center;
            max-width: 400px;

        h2 {
            color: #ff5252;

        }
        p {
            font-size: 16px;
            line-height: 1.5;

            background-color: #4CAF50;

            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;

    <div class="container">
